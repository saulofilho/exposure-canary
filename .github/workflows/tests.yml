name: Run Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Test CLI
        run: |
          set -eu
          exposure-canary --version
          exposure-canary create --kind dns --label zona --asset example.com --zone example.com --owned --state /tmp/exposure-canary
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("/tmp/exposure-canary/state.json").read_text())
          Path("/tmp/hook.json").write_text(json.dumps({
              "observed_at": "2026-10-14T12:00:00Z",
              "source": "203.0.113.10",
              "qname": state["canaries"][0]["value"],
          }))
          PY
          exposure-canary import-webhook /tmp/hook.json --state /tmp/exposure-canary
          exposure-canary report --state /tmp/exposure-canary | grep -q Alta
