[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exposure-canary"
version = "0.1.0"
description = "Defensive canaries for assets you own — URL, DNS, and email — with webhook import, dedup, severity, and a Markdown report"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Saulo Filho", email = "saulofilho@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
mcp = [
    "mcp>=2.0.0",
]
dev = [
    "mcp>=2.0.0",
]

[project.urls]
Repository = "https://github.com/saulofilho/exposure-canary"

[project.scripts]
exposure-canary = "exposure_canary.cli:main"
exposure-canary-mcp = "exposure_canary.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
